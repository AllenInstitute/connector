name: connector
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # Scientific stack (from conda-forge):
  - numpy>=1.24
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib-base>=3.7   # -base avoids pulling heavy GUI backends; fine for notebooks
  - seaborn>=0.12
  - ipykernel   # registers this env as a Jupyter kernel; open notebooks from
                # VS Code or a separately-installed JupyterLab (swap for
                # `jupyterlab` if you want a `jupyter lab` command in this env)
  - pip:
      # PyTorch: the line below installs the default (usually CPU-only) wheel.
      # For a GPU build, replace it with the matching CUDA install command from
      # https://pytorch.org/get-started/locally/ before running `conda env create`.
      # torch>=2.6 is required (the code uses torch.accelerator).
      - torch>=2.6
      # PyPI-only packages (not on conda channels):
      - flow_matching>=1.0
      - geomloss>=0.2.6

# Usage:
#   conda env create -f environment.yml
#   conda activate connector
#   python -m ipykernel install --user --name connector --display-name "Python (connector)"
# then select the "Python (connector)" kernel in VS Code / JupyterLab.
